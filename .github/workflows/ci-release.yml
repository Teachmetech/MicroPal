name: CI and Release

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [production]

permissions:
  contents: read

# Serialize production releases so version calculation and tagging cannot race.
concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/release-policy.mjs

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check

  release:
    name: GitHub release and VSIX
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [policy, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Version, changelog, package and GitHub Release
        id: release
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION_PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}

      - name: Preserve the original release files for recovery
        if: always() && hashFiles('.release/release-manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .release/*.vsix
            .release/release-manifest.json
            .release/CHECKSUMS.sha256
            .release/CHANGELOG.md
            .release/release-notes.md

  vscode:
    name: Publish VS Code Marketplace
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Authenticate with Microsoft Entra workload identity
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish verified GitHub VSIX
        run: node scripts/release-publish.mjs vscode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          EXTENSION_PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          VSCODE_AUTH_MODE: ${{ vars.AZURE_CLIENT_ID != '' && 'azure' || 'pat' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  openvsx:
    name: Publish Open VSX
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Publish verified GitHub VSIX
        run: node scripts/release-publish.mjs openvsx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          EXTENSION_PUBLISHER: ${{ vars.EXTENSION_PUBLISHER }}
          OVSX_TRUSTED_PUBLISHING: ${{ vars.OVSX_TRUSTED_PUBLISHING }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
